name: Shopee Video PoC

on:
  workflow_dispatch:
    inputs:
      url:
        description: Public Shopee product/video URL
        required: true
        type: string

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Verify FFmpeg
        run: ffmpeg -version

      - name: Download Shopee video
        env:
          PYTHONPATH: src
          SHOPEE_URL: ${{ inputs.url }}
        run: python -m shopee_poc.cli "$SHOPEE_URL"

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shopee-poc-output
          path: output/
          if-no-files-found: warn
          retention-days: 1
